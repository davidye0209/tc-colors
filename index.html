<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>中国传统色 | TC Colors</title>

		<!-- Brand Favicon (Organic Watercolor Blob with Gold Splatter) -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M5,50 C5,10 40,5 90,15 C110,40 95,90 50,95 C10,100 5,75 5,50 Z' fill='%23d35400' /%3E%3Ccircle cx='75' cy='30' r='5' fill='%23FFD700' opacity='0.6' /%3E%3Ccircle cx='85' cy='50' r='4' fill='%23FFD700' opacity='0.8' /%3E%3Ccircle cx='60' cy='20' r='3' fill='%23FFD700' opacity='0.5' /%3E%3C/svg%3E"
		/>

		<!-- Fonts: LXGW WenKai TC for classic calligraphy, ZCOOL XiaoWei for quote, DM Mono for hex numbers, Outfit for UI, Inter for body -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;600;700;900&family=Outfit:wght@400;500;600;700&family=LXGW+WenKai+TC&family=ZCOOL+XiaoWei&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- Load Global CORS-proof Database Script -->
		<script src="colors_db.js"></script>

		<!-- Modular Stylesheets (Option A Component Split) -->
		<link rel="stylesheet" href="css/tokens.css" />
		<link rel="stylesheet" href="css/layout.css" />
		<link rel="stylesheet" href="css/sidebar.css" />
		<link rel="stylesheet" href="css/swatches.css" />
		<link rel="stylesheet" href="css/hero.css" />
	</head>
	<body>
		<!-- Ink Bleed Expansion Overlay -->
		<div class="ink-bleed-overlay" id="inkBleedOverlay"></div>

		<!-- Global Xuan Paper Noise Overlay -->
		<div class="paper-texture"></div>

		<!-- SVG Wet Brush Stroke Displacement Filters (100% Local Fractal Noise) -->
		<svg
			style="
				position: absolute;
				width: 0;
				height: 0;
				pointer-events: none;
			"
		>
			<defs>
				<filter id="brush-filter">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0.06"
						numOctaves="4"
						result="noise"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="noise"
						scale="12"
						xChannelSelector="R"
						yChannelSelector="G"
					/>
				</filter>
				<filter id="brush-filter-active">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0.04"
						numOctaves="5"
						result="noise"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="noise"
						scale="18"
						xChannelSelector="R"
						yChannelSelector="G"
					/>
				</filter>
				<filter id="ink-bleed-filter">
					<feTurbulence
						type="fractalNoise"
						baseFrequency="0.012"
						numOctaves="3"
						result="noise"
					/>
					<feDisplacementMap
						in="SourceGraphic"
						in2="noise"
						scale="120"
					/>
				</filter>
			</defs>
		</svg>

		<!-- Active Stage - Split View -->
		<div class="stage-container" id="stageContainer">
			<!-- Left Half Stage: Dynamic Interactive Views -->
			<div class="stage-left" id="stageLeft">
				<!-- Header Section -->
				<header>
					<div style="display: flex; align-items: center; gap: 12px">
						<a href="https://tc-colors.vercel.app" class="logo"
							>中国传统<span>色</span></a
						>
					</div>

					<!-- Premium Fuzzy Search Input on Top Right -->
					<div class="search-bar-container">
						<input
							type="text"
							class="search-input"
							id="searchInput"
							placeholder=" 蓝 | LAN | #6B798E"
							onfocus="this.placeholder = ''"
							onblur="this.placeholder = ' 蓝 | LAN | #6B798E'"
							oninput="handleSearch()"
						/>
					</div>
				</header>

				<!-- Premium Tab Bar Navigation -->
				<div class="tabs-nav-container">
					<button
						class="nav-tab-btn active"
						id="main-tab-groups"
						onclick="switchMainTab('groups')"
					>
						<span>色彩分群</span>
					</button>
					<button
						class="nav-tab-btn"
						id="main-tab-seasons"
						onclick="switchMainTab('seasons')"
					>
						<span>时令节气</span>
					</button>
				</div>

				<!-- Tab 1: Color Groups Container -->
				<div class="tab-content" id="tabContentGroups">
					<div id="hueGroupsSelectView" class="hue-cards-grid">
						<!-- Dynamic Hue cards -->
					</div>
					<div class="group-view-header" style="margin-top: 8px">
						<span class="group-view-title" id="groupColorsTitle"
							>朱赤系谱</span
						>
					</div>
					<div class="tab-split-layout">
						<div
							class="ribbon-swatches-list"
							id="hueGroupColorsGrid"
						>
							<!-- Compact horizontal ribbon swatch strips -->
						</div>
						<div class="tab-palettes-column" id="groupPalettesGrid">
							<!-- 6 Dynamic Intention Palettes stacked here -->
						</div>
					</div>
				</div>

				<!-- Tab 2: Seasonal Groups Container -->
				<div
					class="tab-content"
					id="tabContentSeasons"
					style="display: none"
				>
					<!-- Unified Top Row: Accordion on Left, 6 Term Buttons on Right -->
					<div class="season-unified-header">
						<!-- Left Column: Vertical Accordion Season Stack -->
						<div class="season-tabs-stack" id="seasonTabsStack">
							<!-- Dynamically populated vertical accordion cards for 春, 夏, 秋, 冬 -->
						</div>

						<!-- Right Column: 6 Terms Symmetrical Grid -->
						<div class="solar-terms-grid" id="solarTermsGrid">
							<!-- Clickable 6 active season terms -->
						</div>
					</div>

					<div class="tab-split-layout">
						<div id="seasonSwatchesView">
							<div
								class="ribbon-swatches-list"
								id="seasonGrid4x4"
							>
								<!-- Dynamic seasonal ribbons -->
							</div>
						</div>
						<div
							class="tab-palettes-column"
							id="seasonPalettesGrid"
						>
							<!-- 6 Dynamic Intention Palettes stacked here -->
						</div>
					</div>
				</div>

				<!-- Search Results Container -->
				<div
					class="tab-content"
					id="tabContentSearch"
					style="display: none"
				>
					<div class="group-view-header">
						<span class="group-view-title">搜索结果</span>
					</div>
					<div class="tab-split-layout" id="searchSplitLayout">
						<div class="ribbon-swatches-list" id="searchColLeft">
							<!-- Left column results -->
						</div>
						<div class="ribbon-swatches-list" id="searchColRight">
							<!-- Right column results -->
						</div>
					</div>
				</div>
			</div>

			<!-- Right Half Stage: Vertical Calligraphic Zen Scroll Panel -->
			<div class="stage-right" id="stageRight">
				<div class="stage-right-hero" id="detailHero">
					<!-- Color Name Group (Top Right) -->
					<div class="hero-name-group">
						<div class="hero-name-zh" id="viewerNameZh">黄白游</div>
						<div class="hero-meta-badge" id="viewerMetaBadge">
							立春 · 土
						</div>
					</div>
					<!-- Poem Group (Middle to Left, starting from middle down) -->
					<div class="hero-poem-group">
						<div class="hero-poem-text" id="viewerPoetry">
							欲识金银气，多从黄白游；一生痴绝处，无梦到徽州。
						</div>
						<div class="hero-poem-citation" id="viewerCitation">
							---- 汤显祖 [有友人怜予乏劝 为黄山白岳之游]
						</div>
					</div>
				</div>

				<!-- Page Credits -->
				<div class="page-footer">
					<div
						class="footer-link"
						data-url="https://www.amazon.com/Traditional-Colors-China-Chinese-Guo/dp/7521716051"
						onclick="window.open(this.dataset.url, '_blank')"
					>
						支持原书
					</div>
					<div
						class="footer-link"
						data-url="https://github.com/davidye0209/tc-colors"
						onclick="window.open(this.dataset.url, '_blank')"
					>
						项目链接
					</div>
					<div>2026</div>
				</div>
			</div>
		</div>

		<!-- Tooltip -->
		<div class="well-tooltip" id="wellTooltip"></div>

		<!-- Toast Notification -->
		<div class="toast" id="toast">复制成功</div>

		<!-- Modular Core Coordinator (ES Modules Entry Point) -->
		<script type="module" src="js/app.js"></script>
	</body>
</html>
