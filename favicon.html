<!doctype html>

<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Watercolor Tag Components</title>
		<link
			href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&amp;display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #f7f2ea;
				--ink: #1a1410;
				--grain-opacity: 0.04;
			}
			body {
				background-color: var(--bg);
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				margin: 0;
				font-family: "LXGW WenKai TC", serif;
				position: relative;
			}
			body::before {
				content: "";
				position: fixed;
				inset: 0;
				pointer-events: none;
				z-index: 1000;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
				opacity: var(--grain-opacity);
			}
			.component-preview {
				display: flex;
				gap: 40px;
				padding: 60px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 40px;
			}
			.hue-group-card {
				width: 100px;
				height: 100px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				position: relative;
				transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
				background: transparent;
			}
			.hue-group-card::after {
				content: "";
				position: absolute;
				inset: -5px;
				z-index: -1;
				background: radial-gradient(
					circle at center,
					color-mix(in srgb, var(--group-accent) 40%, transparent) 0%,
					color-mix(in srgb, var(--group-accent) 85%, transparent) 80%,
					var(--group-accent) 100%
				);
				border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
				filter: url(#brush-filter);
				box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1);
				transition: all 0.5s ease;
				opacity: 0.9;
			}
			.hue-group-card .splatter {
				position: absolute;
				inset: 0;
				pointer-events: none;
				z-index: 1;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='gold'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3CfeColorMatrix values='0 0 0 0 0.8 0 0 0 0 0.6 0 0 0 0 0.2 0 0 0 1 0'/%3E%3C/filter%3E%3Ccircle cx='80' cy='30' r='1' filter='url(%23gold)' opacity='0.6'/%3E%3Ccircle cx='85' cy='35' r='1.5' filter='url(%23gold)' opacity='0.8'/%3E%3Ccircle cx='75' cy='40' r='0.5' filter='url(%23gold)' opacity='0.5'/%3E%3Ccircle cx='82' cy='45' r='1.2' filter='url(%23gold)' opacity='0.7'/%3E%3Ccircle cx='88' cy='50' r='0.8' filter='url(%23gold)' opacity='0.4'/%3E%3C/svg%3E");
				background-size: cover;
				mix-blend-mode: overlay;
				opacity: 0.8;
			}
			.hue-group-card:hover {
				transform: scale(1.1) rotate(2deg);
			}
			.hue-group-card:hover::after {
				filter: url(#brush-filter-active);
				opacity: 1;
			}
			.hue-group-card.active {
				transform: translateY(5px) scale(1.05);
			}
			.hue-group-card.active::after {
				box-shadow:
					0 10px 20px rgba(var(--group-accent-rgb), 0.2),
					inset 0 0 20px rgba(0, 0, 0, 0.1);
			}
			.hue-group-name {
				font-size: 18px;
				font-weight: 700;
				color: #fff;
				text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
				writing-mode: vertical-rl;
				text-orientation: upright;
				z-index: 2;
				letter-spacing: 0.1em;
			}
			.svg-filters {
				position: absolute;
				width: 0;
				height: 0;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<svg class="svg-filters">
			<defs>
				<filter id="brush-filter">
					<feturbulence
						basefrequency="0.06"
						numoctaves="4"
						result="noise"
						type="fractalNoise"
					></feturbulence>
					<fedisplacementmap
						in="SourceGraphic"
						in2="noise"
						scale="12"
						xchannelselector="R"
						ychannelselector="G"
					></fedisplacementmap>
				</filter>
				<filter id="brush-filter-active">
					<feturbulence
						basefrequency="0.04"
						numoctaves="5"
						result="noise"
						type="fractalNoise"
					></feturbulence>
					<fedisplacementmap
						in="SourceGraphic"
						in2="noise"
						scale="18"
						xchannelselector="R"
						ychannelselector="G"
					></fedisplacementmap>
				</filter>
			</defs>
		</svg>
		<div class="component-preview">
			<div
				class="hue-group-card"
				style="--group-accent: #2e59a7; --group-accent-rgb: 44, 62, 80"
			>
				<div class="splatter"></div>
				<div class="hue-group-name"></div>
			</div>
			<div
				class="hue-group-card"
				style="--group-accent: #d35400; --group-accent-rgb: 211, 84, 0"
			>
				<div class="splatter"></div>
				<div class="hue-group-name"></div>
			</div>
			<div
				class="hue-group-card active"
				style="--group-accent: #446a37; --group-accent-rgb: 125, 102, 8"
			>
				<div class="splatter"></div>
				<div class="hue-group-name"></div>
			</div>
			<div
				class="hue-group-card"
				style="
					--group-accent: #e59866;
					--group-accent-rgb: 229, 152, 102;
				"
			>
				<div class="splatter"></div>
				<div class="hue-group-name">肉粉</div>
			</div>
		</div>
		<script>
			document.querySelectorAll(".hue-group-card").forEach((card) => {
				card.addEventListener("click", () => {
					document
						.querySelectorAll(".hue-group-card")
						.forEach((c) => c.classList.remove("active"));
					card.classList.add("active");
				});
			});
		</script>
	</body>
</html>
